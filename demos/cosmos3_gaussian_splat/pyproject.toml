[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmos3-gaussian-splat"
version = "0.1.0"
description = "Generate camera-controlled Cosmos 3 views and reconstruct a Gaussian splat."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "OpenMDW-1.1" }
dependencies = [
  "huggingface-hub>=1.3.2",
  "imageio>=2.37.0",
  "imageio-ffmpeg>=0.6.0",
  "jinja2>=3.1.6",
  "numpy>=1.26.0,<2",
  "pillow>=11.0.0",
  "scipy>=1.14.0",
  "tyro>=0.9.0",
]

[project.optional-dependencies]
gpu = [
  "accelerate>=1.12.0",
  "diffusers @ git+https://github.com/huggingface/diffusers.git",
  "gsplat>=1.5.3",
  "opencv-python-headless>=4.11.0",
  "pycolmap>=3.13.0",
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "transformers>=5.11.0",
  "vggt @ git+https://github.com/facebookresearch/vggt.git",
]
test = [
  "pytest>=8.3.0",
  "ruff>=0.16.4",
]

[project.scripts]
cosmos3-gsplat = "cosmos3_gsplat.cli:main"
cosmos3-gsplat-submit = "cosmos3_gsplat.hf_jobs:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos3_gsplat"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
